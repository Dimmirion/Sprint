version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - FSTR_DB_HOST=your-db-host
      - FSTR_DB_PORT=5432
      - FSTR_DB_NAME=mountain_pass
      - FSTR_DB_LOGIN=your-db-user
      - FSTR_DB_PASS=your-db-password
    restart: unless-stopped

  # Если используете PostgreSQL в контейнере
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: your-db-user
      POSTGRES_PASSWORD: your-db-password
      POSTGRES_DB: mountain_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: